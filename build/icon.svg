<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 底板：电光蓝渐变。中高明度，纯白底和纯黑底上都能看清边界 -->
    <linearGradient id="plate" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#7fb0ff"/>
      <stop offset="0.5" stop-color="#3d74f0"/>
      <stop offset="1" stop-color="#1c3cab"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.06" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 壶身：冷白，和蓝底拉开明度差 -->
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde8fb"/>
    </linearGradient>
    <linearGradient id="body2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f5ff"/>
      <stop offset="1" stop-color="#dae6f9"/>
    </linearGradient>
    <!-- 下壶：比上壶深一档，腰环的台阶才看得出来 -->
    <linearGradient id="deep" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d3e1f8"/>
      <stop offset="1" stop-color="#a9c0e8"/>
    </linearGradient>
    <!-- 面罩：深海军蓝，机器人"脸"的载体 -->
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a52"/>
      <stop offset="1" stop-color="#0d1633"/>
    </linearGradient>
    <!-- 发光件：眼睛、天线球、星芒共用一套强调色。蓝底上取暖金，对比最狠 -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd88a"/>
      <stop offset="1" stop-color="#ef9f2e"/>
    </linearGradient>
    <filter id="softglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <path id="spark" d="M 0 -1 Q 0.13 -0.13 1 0 Q 0.13 0.13 0 1 Q -0.13 0.13 -1 0 Q -0.13 -0.13 0 -1 Z"/>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#plate)"/>
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#glow)"/>

  <!--
    壶体整体放大 1.38 倍：以壶自身包围盒中心 (499,563) 对齐画布中心 (512,512)，
    底板内边距从上版的 30% 收到约 11%，蓝色留白不再喧宾夺主。
    星芒不跟这层缩放走（否则会被顶出底板），单独按最终坐标摆放。
  -->
  <g transform="translate(505 512) scale(1.30) translate(-499 -563)">

    <!-- 天线：原来的盖钮改成杆 + 发光球 -->
    <rect x="505" y="336" width="14" height="82" rx="7" fill="url(#body2)"/>
    <circle cx="512" cy="326" r="32" fill="#ffcf7a" opacity="0.45" filter="url(#softglow)"/>
    <circle cx="512" cy="326" r="22" fill="url(#accent)"/>

    <!-- 把手：贴着壶身的小弧，读起来也像机器人的一条手臂 -->
    <path d="M 408 500 C 336 505 320 570 326 620 C 331 668 362 690 402 686"
          fill="none" stroke="url(#body2)" stroke-width="44" stroke-linecap="round"/>

    <!-- 下壶 -->
    <path fill="url(#deep)" d="M 394 640 L 630 640 L 660 806 Q 663 822 648 822 L 376 822 Q 361 822 364 806 Z"/>
    <!-- 腰环 -->
    <rect x="384" y="600" width="256" height="40" rx="11" fill="url(#body)"/>
    <!-- 上壶：机器的"头" -->
    <path d="M 394 600 L 630 600 L 608 446 L 416 446 Z" fill="url(#body)"/>
    <!-- 壶盖：像顶帽子 -->
    <path d="M 416 446 L 608 446 L 590 414 L 434 414 Z" fill="url(#body)"/>
    <!-- 壶嘴 -->
    <path d="M 600 446 L 684 392 Q 692 386 698 396 Q 703 405 695 412 L 596 500 Z" fill="url(#body)"/>

    <!-- 面罩 + 双眼 -->
    <rect x="438" y="486" width="148" height="58" rx="26" fill="url(#visor)"/>
    <g filter="url(#softglow)" opacity="0.85">
      <circle cx="478" cy="515" r="17" fill="#ffcf7a"/>
      <circle cx="546" cy="515" r="17" fill="#ffcf7a"/>
    </g>
    <circle cx="478" cy="515" r="14" fill="url(#accent)"/>
    <circle cx="546" cy="515" r="14" fill="url(#accent)"/>
  </g>

  <!-- 星芒：按最终坐标定位，落在壶嘴上方那片空档里，不顶出底板 -->
  <g fill="url(#accent)">
    <use href="#spark" transform="translate(772 232) scale(54)"/>
    <use href="#spark" transform="translate(712 182) scale(22)" opacity="0.85"/>
  </g>
</svg>
